  <g id="text_2">
   <text style="fill: #18332e; font: 700 33px 'DejaVu Sans'; text-anchor: start" x="63.36" y="93.96" transform="rotate(-0 63.36 93.96)">Can models make useful signal decisions?</text>
  </g>
  <g id="text_3">
   <text style="fill: #60756b; font: 16px 'DejaVu Sans'; text-anchor: start" x="63.36" y="128.304" transform="rotate(-0 63.36 128.304)">Five controllers. Identical demand. One shared planning task.</text>
  </g>
  <g id="text_4">
   <text style="fill: #34735b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="95.616" y="236.52" transform="rotate(-0 95.616 236.52)">Same input format</text>
  </g>
  <g id="text_5">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 285.077344)">NS / EW queues</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 309.92643)">Arrival forecast</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 334.775516)">Signal phase + timers</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 359.624602)">Legal actions</text>
  </g>
  <g id="text_6">
   <text style="fill: #34735b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="452.736" y="236.52" transform="rotate(-0 452.736 236.52)">Five controllers</text>
  </g>
  <g id="text_7">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 285.077344)">Gurobi</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 309.92643)">Microsoft · Jev · Luna</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 334.775516)">Sol, medium reasoning</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 359.624602)">Choose NS or EW</text>
  </g>
  <g id="text_8">
   <text style="fill: #34735b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="804.096" y="236.52" transform="rotate(-0 804.096 236.52)">Same rules</text>
  </g>
  <g id="text_9">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 285.077344)">15 s planning horizon</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 309.92643)">120 s SUMO episode</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 334.775516)">5 / 3 / 2 s signal timing</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 359.624602)">78 cars · demand seed 7</text>
  </g>
  <g id="text_10">
   <text style="fill: #34735b; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="74.88" y="518.4" transform="rotate(-0 74.88 518.4)">TRAFFIC OUTCOMES</text>
  </g>
  <g id="text_11">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'; text-anchor: start" x="74.88" y="550.8" transform="rotate(-0 74.88 550.8)">Completion, all-demand system time, travel / wait, approach coverage.</text>
  </g>
  <g id="text_12">
   <text style="fill: #60756b; font: 13px 'DejaVu Sans'; text-anchor: start" x="74.88" y="592.92" transform="rotate(-0 74.88 592.92)">States diverge after different actions. Optimization quality is evaluated separately on frozen instances.</text>
