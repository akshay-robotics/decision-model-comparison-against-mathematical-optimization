  <g id="text_1">
   <text style="fill: #34735b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="63.36" y="42.12" transform="rotate(-0 63.36 42.12)">TRAFFIC DECISION LAB  /  EARLY EXPERIMENT</text>
  </g>
  <g id="text_2">
   <text style="fill: #18332e; font: 700 33px 'DejaVu Sans'; text-anchor: start" x="63.36" y="93.96" transform="rotate(-0 63.36 93.96)">Give unfinished queues a cost.</text>
  </g>
  <g id="text_3">
   <text style="fill: #60756b; font: 16px 'DejaVu Sans'; text-anchor: start" x="63.36" y="128.304" transform="rotate(-0 63.36 128.304)">One additional term. The same revised question for every model.</text>
  </g>
  <g id="text_4">
   <text style="fill: #34735b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="95.616" y="236.52" transform="rotate(-0 95.616 236.52)">Accumulated queues</text>
  </g>
  <g id="text_5">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 285.077344)">Add NS + EW queues</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 309.92643)">after each second.</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(95.616 334.775516)">Includes the final step.</text>
  </g>
  <g id="text_6">
   <text style="fill: #34735b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="452.736" y="236.52" transform="rotate(-0 452.736 236.52)">Switching cost</text>
  </g>
  <g id="text_7">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 285.077344)">0.5 × initiated switches</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 309.92643)">Safety timings remain</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(452.736 334.775516)">the same.</text>
  </g>
  <g id="text_8">
   <text style="fill: #cc674b; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="804.096" y="236.52" transform="rotate(-0 804.096 236.52)">Final-queue cost</text>
  </g>
  <g id="text_9">
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 285.077344)">10 × cars still queued</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 309.92643)">at the planning boundary.</text>
   <text style="fill: #18332e; font: 17px 'DejaVu Sans'" transform="translate(804.096 334.775516)">Added once.</text>
  </g>
  <g id="text_10">
   <text style="fill: #18332e; font: 34px 'DejaVu Sans'; text-anchor: start" x="380.16" y="330.48" transform="rotate(-0 380.16 330.48)">+</text>
  </g>
  <g id="text_11">
   <text style="fill: #18332e; font: 34px 'DejaVu Sans'; text-anchor: start" x="731.52" y="330.48" transform="rotate(-0 731.52 330.48)">+</text>
  </g>
  <g id="text_12">
   <text style="fill: #18332e; font: 700 26px 'DejaVu Sans'; text-anchor: start" x="74.88" y="492.48" transform="rotate(-0 74.88 492.48)">J = Σ(q_NS + q_EW) + 0.5 × switches + 10 × final queue</text>
  </g>
  <g id="text_13">
   <text style="fill: #cc674b; font: 18px 'DejaVu Sans'; text-anchor: start" x="74.88" y="550.8" transform="rotate(-0 74.88 550.8)">Example: 3 cars left in the modeled final queue → +30 cost units.</text>
  </g>
  <g id="text_14">
   <text style="fill: #60756b; font: 13px 'DejaVu Sans'; text-anchor: start" x="74.88" y="599.4" transform="rotate(-0 74.88 599.4)">Weight 10 was fixed before the rerun. A modeled queue penalty is not a direct count of completed SUMO trips.</text>
  </g>
